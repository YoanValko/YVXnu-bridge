name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ubuntu-x86-64:
    name: Ubuntu x86-64
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config python3 linux-headers-$(uname -r) libdrm-dev libvirglrenderer-dev libvirglrenderer1

      - name: Run non-loading checks
        # GitHub-hosted runners do not provide a VirGL render context. The
        # local smoke test remains available with the project's VirGL setup.
        run: make check VIRGL=0

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: yvxnu-bridge-amd64-${{ github.sha }}
          path: |
            fki-ko/fki.ko
            xnu-ko/xnu.ko
            gpu/xnu-drm/xnudrmd
          if-no-files-found: error
          retention-days: 7
