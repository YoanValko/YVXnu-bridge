<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">YVXnu-bridge split glass face and Linux penguin logo</title>
  <desc id="desc">An original split mark: a blue glass face inspired by desktop finder icons on the left and a Linux penguin on the right.</desc>
  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dff7ff"/>
      <stop offset=".45" stop-color="#6dd5ff"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="finderGlass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b9f2ff"/>
      <stop offset=".32" stop-color="#65d6ff"/>
      <stop offset=".72" stop-color="#3788ef"/>
      <stop offset="1" stop-color="#2544bf"/>
    </linearGradient>
    <linearGradient id="finderFace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fdff" stop-opacity=".96"/>
      <stop offset=".45" stop-color="#dff7ff" stop-opacity=".86"/>
      <stop offset="1" stop-color="#9bdcff" stop-opacity=".72"/>
    </linearGradient>
    <linearGradient id="penguinBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#26354f"/>
      <stop offset=".5" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="belly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#020617" flood-opacity=".28"/>
    </filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <clipPath id="iconClip">
      <rect x="32" y="32" width="960" height="960" rx="226"/>
    </clipPath>
  </defs>

  <rect x="32" y="32" width="960" height="960" rx="226" fill="#0f172a" filter="url(#shadow)"/>
  <g clip-path="url(#iconClip)">
    <rect x="32" y="32" width="480" height="960" fill="url(#finderGlass)"/>
    <rect x="512" y="32" width="480" height="960" fill="#111827"/>

    <circle cx="180" cy="140" r="180" fill="#ffffff" opacity=".22" filter="url(#glow)"/>
    <circle cx="870" cy="880" r="220" fill="#2563eb" opacity=".22" filter="url(#glow)"/>
    <path d="M32 180C230 72 410 88 512 144V32H32Z" fill="#ffffff" opacity=".15"/>
    <path d="M512 880C690 972 850 952 992 832V992H512Z" fill="#38bdf8" opacity=".12"/>

    <!-- Original Finder-inspired glass face -->
    <path d="M94 236C94 146 148 94 240 94H510V930H240C148 930 94 878 94 788Z"
          fill="url(#finderFace)" stroke="#ffffff" stroke-opacity=".66" stroke-width="5"/>
    <path d="M510 94V930" stroke="#ffffff" stroke-opacity=".52" stroke-width="6"/>
    <path d="M126 260C126 177 174 132 252 132H474" fill="none" stroke="#ffffff" stroke-opacity=".58" stroke-width="16" stroke-linecap="round"/>
    <path d="M198 460C198 433 219 412 246 412C273 412 294 433 294 460C294 487 273 508 246 508C219 508 198 487 198 460Z" fill="#0f2f68" opacity=".9"/>
    <path d="M374 460C374 433 395 412 422 412C449 412 470 433 470 460C470 487 449 508 422 508C395 508 374 487 374 460Z" fill="#0f2f68" opacity=".9"/>
    <circle cx="232" cy="444" r="11" fill="#ffffff" opacity=".78"/>
    <circle cx="408" cy="444" r="11" fill="#ffffff" opacity=".78"/>
    <path d="M206 610C256 660 366 660 442 598" fill="none" stroke="#0f2f68" stroke-width="24" stroke-linecap="round"/>
    <path d="M164 760C244 824 364 824 452 758" fill="none" stroke="#ffffff" stroke-opacity=".32" stroke-width="13" stroke-linecap="round"/>

    <!-- Linux penguin -->
    <path d="M738 248C636 248 574 332 574 470V684C574 818 650 894 766 894C882 894 958 818 958 684V470C958 332 876 248 738 248Z"
          fill="url(#penguinBody)"/>
    <path d="M617 484C567 510 542 594 560 668C574 724 614 736 646 696L688 628L664 508Z" fill="#17233a"/>
    <path d="M880 484C930 510 955 594 937 668C923 724 883 736 851 696L809 628L833 508Z" fill="#17233a"/>
    <ellipse cx="766" cy="636" rx="126" ry="202" fill="url(#belly)"/>
    <ellipse cx="710" cy="440" rx="42" ry="48" fill="#f8fafc"/>
    <ellipse cx="822" cy="440" rx="42" ry="48" fill="#f8fafc"/>
    <circle cx="720" cy="446" r="14" fill="#0f172a"/>
    <circle cx="812" cy="446" r="14" fill="#0f172a"/>
    <path d="M744 490L766 472L788 490L766 518Z" fill="#f59e0b"/>
    <path d="M708 862C664 882 632 908 648 936C672 972 738 944 766 912C794 944 860 972 884 936C900 908 868 882 824 862C790 876 742 876 708 862Z" fill="#f59e0b"/>
    <path d="M688 320C724 288 808 288 844 320" fill="none" stroke="#475569" stroke-opacity=".55" stroke-width="14" stroke-linecap="round"/>

    <path d="M512 32V992" stroke="#ffffff" stroke-opacity=".26" stroke-width="4"/>
    <path d="M58 210C250 88 394 112 512 160" fill="none" stroke="#ffffff" stroke-opacity=".34" stroke-width="8"/>
  </g>
  <rect x="32" y="32" width="960" height="960" rx="226" fill="none" stroke="url(#frame)" stroke-width="18"/>
</svg>
